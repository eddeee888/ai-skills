name: Validate instructions

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate repository instructions
        run: bash scripts/validate.sh

  hook-tests:
    name: Hook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The hooks import `claude-code` and `claude-code/testing`, which only Claude Code provides, so
      # `claude plugin test` is the runner. It needs no login, API key or bun.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.302
      - name: Run the cops hook tests
        run: claude plugin test cops
