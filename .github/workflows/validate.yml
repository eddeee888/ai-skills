name: Validate instructions

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate repository instructions
        run: bash scripts/validate.sh

  hook-tests:
    name: Hook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The hooks import `claude-code` and `claude-code/testing`, which only Claude Code provides, so
      # `claude plugin test` is the runner. It needs no login, API key or bun. Claude Code is a
      # devDependency pinned in package.json; pnpm comes from its `packageManager` field.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run the cops hook tests
        run: pnpm test:hooks
