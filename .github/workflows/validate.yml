name: Validate instructions

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository instructions
        run: python3 scripts/validate.py
      - name: Test workspace memory discovery
        run: python3 scripts/test_memory_context.py
