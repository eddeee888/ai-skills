<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Tweak here, in units of the 128 canvas:
       --gap:   white gap between overlapping letters
       --thick: extra stroke added to every letter (base O stroke is 6.44) -->
  <style>
    svg{--gap:4px;--thick:1.35px}
    .ink{stroke:#000;stroke-width:var(--thick);stroke-linejoin:round}
    .gap{stroke:#fff;stroke-width:calc(2 * var(--gap) + var(--thick));stroke-linejoin:round}
    .ring{fill:none;stroke:#000;stroke-width:calc(6.44px + var(--thick))}
  </style>
