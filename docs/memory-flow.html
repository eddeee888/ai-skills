<!doctype html>
<!--
  Source for docs/memory-flow.png. Edit the SVG to match the code, then run
  `bash scripts/render-memory-flow.sh`. Plugin versions come from the manifests.
  The update prompt is in the root README, under Development.
-->
<html lang="en" data-ready="">
<meta charset="utf-8">
<title>cops &amp; oss memory flow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=block">
<style>
:root {
  --bg: #12161d; --surface: #1a2029; --fg: #e3e7ee; --muted: #98a1b2; --line: #2f3744;
  --oracle: #8ea2ff; --sidekick: #4fd1bb; --write: #f2a65a;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
body { margin: 0; background: var(--surface); color: var(--fg); font: 15px/1.6 var(--sans); }
figure { margin: 0; padding: 16px; border: 1px solid var(--line); }
header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
header strong { font-size: 16px; }
header span { font: 12.5px var(--mono); color: var(--muted); }
svg { display: block; width: 100%; height: auto; color: var(--fg); }
svg text { font-family: var(--sans); fill: currentColor; font-size: 12px; }
svg .mono { font-family: var(--mono); font-size: 11.5px; }
svg .t { font-weight: 600; font-size: 14px; }
svg .m { fill: var(--muted); }
svg .box { fill: var(--surface); stroke: currentColor; stroke-width: 1.2; }
svg .soft { fill: none; stroke: var(--line); stroke-width: 1; }
svg .pill { fill: var(--bg); stroke: var(--line); }
svg .dash { stroke-dasharray: 5 4; }
svg .edge { fill: none; stroke: currentColor; stroke-width: 1.3; }
svg .o { color: var(--oracle); } svg .o text { fill: var(--oracle); }
svg .s { color: var(--sidekick); } svg .s text { fill: var(--sidekick); }
svg .w { color: var(--write); } svg .w text { fill: var(--write); }
.legend { display: flex; gap: 20px; margin-top: 12px; font-size: 13px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 6px; background: var(--c); }
</style>
<figure>
  <header>
    <strong>How memory flows through cops &amp; oss</strong>
    <span id="versions">cops ? · oss ?</span>
  </header>
  <svg viewBox="0 0 1040 580" role="img" aria-label="The main chat runs a cops or oss skill. It calls pr-oracle for read-only advice and pr-sidekick for edit, test, commit and push loops. A SessionStart hook injects the memory root. Only the oracle receives the memory root and reads the memory repo, and only its learn-feedback mode writes it. The sidekick gets remembered rules through its prompt.">
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
      </marker>
    </defs>

    <!-- Left column -->
    <rect class="box" x="20" y="40" width="180" height="70" rx="4"/>
    <text class="t" x="34" y="66">SessionStart hook</text>
    <text class="mono m" x="34" y="86">memory-context.sh</text>
    <text class="m" x="34" y="102" style="font-size:11px">verifies PR_MEMORY_PATH</text>

    <rect class="box" x="20" y="190" width="180" height="80" rx="4"/>
    <text class="t" x="34" y="216">You</text>
    <text class="mono m" x="34" y="238">/cops:pr-sync</text>
    <text class="mono m" x="34" y="256">/oss:issue-fix …</text>

    <rect class="box dash" x="20" y="320" width="180" height="120" rx="4"/>
    <text class="t" x="34" y="346">cops not installed?</text>
    <text class="m" x="34" y="368" style="font-size:11.5px">oracle step → run inline</text>
    <text class="m" x="34" y="386" style="font-size:11.5px">sidekick → general-purpose</text>
    <text class="m" x="34" y="404" style="font-size:11.5px">survey → Explore</text>
    <text class="m" x="34" y="426" style="font-size:11.5px">oss keeps working alone</text>

    <!-- hook -> main -->
    <line class="edge" x1="200" y1="75" x2="288" y2="75" marker-end="url(#ah)"/>
    <text x="244" y="62" text-anchor="middle" style="font-size:11px">memory-root,</text>
    <text x="244" y="92" text-anchor="middle" style="font-size:11px">memory-login</text>
    <text class="m" x="244" y="106" text-anchor="middle" style="font-size:10.5px">(oracle only)</text>

    <!-- user <-> main -->
    <line class="edge" x1="200" y1="212" x2="288" y2="212" marker-end="url(#ah)"/>
    <text x="244" y="204" text-anchor="middle" style="font-size:11px">invokes skill</text>
    <line class="edge" x1="290" y1="250" x2="202" y2="250" marker-end="url(#ah)"/>
    <text x="244" y="268" text-anchor="middle" style="font-size:11px">questions,</text>
    <text x="244" y="282" text-anchor="middle" style="font-size:11px">drafts to confirm</text>

    <!-- Main chat -->
    <rect class="box" x="290" y="20" width="320" height="380" rx="4" style="stroke-width:1.8"/>
    <text class="t" x="306" y="46">Main chat</text>
    <text class="m" x="306" y="66" style="font-size:11.5px">runs the skill · decides · asks you · posts</text>

    <text class="m" x="306" y="98" style="font-size:11px;letter-spacing:.05em">COPS SKILLS</text>
    <rect class="pill" x="306" y="108" width="140" height="24" rx="3"/><text class="mono" x="316" y="124">pr-start</text>
    <rect class="pill" x="306" y="138" width="140" height="24" rx="3"/><text class="mono" x="316" y="154">pr-address</text>
    <rect class="pill" x="306" y="168" width="140" height="24" rx="3"/><text class="mono" x="316" y="184">pr-sync</text>
    <rect class="pill" x="306" y="198" width="140" height="24" rx="3"/><text class="mono" x="316" y="214">pr-review</text>
    <rect class="pill" x="306" y="228" width="140" height="24" rx="3"/><text class="mono" x="316" y="244">pr-note</text>

    <text class="m" x="454" y="98" style="font-size:11px;letter-spacing:.05em">OSS SKILLS</text>
    <rect class="pill" x="454" y="108" width="140" height="24" rx="3"/><text class="mono" x="464" y="124">issue-analyze</text>
    <rect class="pill" x="454" y="138" width="140" height="24" rx="3"/><text class="mono" x="464" y="154">issue-create</text>
    <rect class="pill" x="454" y="168" width="140" height="24" rx="3"/><text class="mono" x="464" y="184">issue-verify</text>
    <rect class="pill" x="454" y="198" width="140" height="24" rx="3"/><text class="mono" x="464" y="214">issue-fix</text>

    <line class="soft" x1="306" y1="264" x2="594" y2="264"/>
    <text class="m" x="306" y="284" style="font-size:11px;letter-spacing:.05em">SHARED RULES · CONVENTIONS*.md</text>
    <text x="306" y="304" style="font-size:11.5px">picks each subagent's model</text>
    <text x="306" y="322" style="font-size:11.5px">passes memory-root to the oracle only</text>
    <text x="306" y="340" style="font-size:11.5px">one editing subagent at a time</text>
    <text x="306" y="358" style="font-size:11.5px">relays agent questions to you, then resumes</text>
    <text x="306" y="376" style="font-size:11.5px">ends every run with a Handoffs: list</text>

    <!-- Oracle -->
    <g class="o">
      <rect class="box" x="700" y="20" width="280" height="200" rx="4" style="stroke-width:1.6"/>
      <text class="t" x="716" y="46">pr-oracle</text>
      <text x="716" y="64" style="font-size:11.5px">advisor · never edits code or GitHub</text>
    </g>
    <text class="m" x="716" y="90" style="font-size:10.5px;letter-spacing:.05em">OPERATIONAL MODES</text>
    <text class="mono" x="716" y="108">scout-repo · brief-task</text>
    <text class="mono" x="716" y="124">triage-threads · sweep-diff</text>
    <text class="mono" x="716" y="140">grill-description</text>
    <text class="m" x="716" y="162" style="font-size:10.5px;letter-spacing:.05em">REVIEW MODES (own call)</text>
    <text class="mono" x="716" y="180">review-pr · draft-author-notes</text>
    <g class="w"><text class="mono" x="716" y="204">learn-feedback  ← writes memory</text></g>

    <g class="o">
      <line class="edge" x1="610" y1="78" x2="698" y2="78" marker-end="url(#ah)"/>
      <text x="655" y="56" text-anchor="middle" style="font-size:11px">mode, inputs,</text>
      <text x="655" y="70" text-anchor="middle" style="font-size:11px">memory-root</text>
      <line class="edge" x1="700" y1="130" x2="612" y2="130" marker-end="url(#ah)"/>
      <text x="655" y="148" text-anchor="middle" style="font-size:11px">advice, rules</text>
      <text x="655" y="162" text-anchor="middle" style="font-size:11px">for the sidekick</text>
    </g>

    <!-- Sidekick -->
    <g class="s">
      <rect class="box" x="700" y="260" width="280" height="120" rx="4" style="stroke-width:1.6"/>
      <text class="t" x="716" y="286">pr-sidekick</text>
      <text x="716" y="304" style="font-size:11.5px">one scoped job, exactly as templated</text>
    </g>
    <text class="mono" x="716" y="328">edit · test · commit · push</text>
    <text x="716" y="348" style="font-size:11.5px">never reads memory or the oracle</text>
    <text x="716" y="366" style="font-size:11.5px">returns questions instead of guessing</text>

    <g class="s">
      <line class="edge" x1="610" y1="290" x2="698" y2="290" marker-end="url(#ah)"/>
      <text x="655" y="270" text-anchor="middle" style="font-size:11px">template +</text>
      <text x="655" y="283" text-anchor="middle" style="font-size:11px">oracle's rules</text>
      <line class="edge" x1="700" y1="345" x2="612" y2="345" marker-end="url(#ah)"/>
      <text x="655" y="363" text-anchor="middle" style="font-size:11px">changed, ran,</text>
      <text x="655" y="377" text-anchor="middle" style="font-size:11px">committed, open</text>
    </g>

    <!-- GitHub -->
    <rect class="box" x="290" y="480" width="320" height="70" rx="4"/>
    <text class="t" x="306" y="506">GitHub + local checkout</text>
    <text class="m" x="306" y="526" style="font-size:11.5px">PRs, review threads, issues, branches</text>

    <line class="edge" x1="450" y1="400" x2="450" y2="478" marker-end="url(#ah)"/>
    <text x="458" y="432" style="font-size:11px">posts reviews, issues,</text>
    <text x="458" y="446" style="font-size:11px">PR edits — after you confirm</text>

    <g class="s">
      <polyline class="edge" points="730,380 730,515 612,515" marker-end="url(#ah)"/>
      <text x="671" y="507" text-anchor="middle" style="font-size:11px">commits, pushes</text>
    </g>

    <!-- Memory -->
    <rect class="box" x="760" y="480" width="220" height="80" rx="4"/>
    <text class="t" x="776" y="504">Memory repo</text>
    <text class="mono m" x="776" y="524">users/&lt;login&gt;/MEMORY.md</text>
    <text class="mono m" x="776" y="542">team/MEMORY.md</text>
    <text class="m" x="776" y="420" style="font-size:11px">no sidekick access:</text>
    <text class="m" x="776" y="436" style="font-size:11px">rules reach it only</text>
    <text class="m" x="776" y="452" style="font-size:11px">through its prompt</text>

    <g class="w">
      <polyline class="edge" points="980,120 1010,120 1010,520 982,520" marker-end="url(#ah)"/>
      <text x="1024" y="320" text-anchor="middle" transform="rotate(90 1024 320)" style="font-size:11px">reads every mode · learn-feedback writes</text>
    </g>
      </svg>
  <div class="legend">
    <span style="--c: var(--oracle)">oracle call (read-only advice)</span>
    <span style="--c: var(--sidekick)">sidekick handoff (edits, commits, pushes)</span>
    <span style="--c: var(--write)">memory write (learn-feedback only)</span>
  </div>
</figure>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('versions').textContent = `cops ${q.get('cops')} · oss ${q.get('oss')}`;
  document.fonts.ready.then(() => { document.documentElement.dataset.ready = 'yes'; });
</script>
</html>
